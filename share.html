<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Doctor Portal — Shared Health Record</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-100 p-4"><main class="max-w-4xl mx-auto bg-white rounded-3xl p-5 md:p-8 border shadow-sm"><div class="flex items-center gap-3"><div class="p-3 bg-emerald-100 text-emerald-700 rounded-2xl">👨‍⚕️</div><div><h1 class="text-2xl font-bold">Doctor Portal</h1><p class="text-sm text-slate-500">Temporary read-only Shared Health Record</p></div></div><div id="out" class="mt-6">Loading...</div></main><script>const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function run(){const code=new URLSearchParams(location.search).get('code')||'';try{const r=await fetch('/api/view-share?code='+encodeURIComponent(code));const d=await r.json();if(!r.ok)throw Error(d.error||'Share invalid');const rcd=d.record||{},i=rcd.info||{};let h=`<div class="grid sm:grid-cols-2 lg:grid-cols-4 gap-3"><div class="p-4 bg-slate-50 rounded-xl border"><b>Patient</b><p>${esc(i.name||'')}</p></div><div class="p-4 bg-slate-50 rounded-xl border"><b>Blood Group</b><p>${esc(i.bloodGroup||'Not set')}</p></div><div class="p-4 bg-slate-50 rounded-xl border"><b>Gender / DOB</b><p>${esc(i.gender||'')} ${i.dob?'· '+esc(i.dob):''}</p></div><div class="p-4 bg-slate-50 rounded-xl border"><b>Emergency</b><p>${esc(i.emergencyName||'')} ${i.emergencyPhone?'· '+esc(i.emergencyPhone):''}</p></div></div>`;const block=(title,text)=>`<section class="mt-5 p-4 border rounded-2xl"><h2 class="font-bold">${title}</h2><p class="whitespace-pre-wrap text-sm mt-2 text-slate-700">${esc(text||'Not provided')}</p></section>`;h+=block('Medical History',rcd.history);h+=block('Previous Diseases',rcd.diseases);h+=block('Allergies',rcd.allergies||i.allergies);h+=block('Current Medicines',rcd.medicines);h+=block('Doctors',rcd.doctors);h+=block('Medical Reports',rcd.reports);h+='<section class="mt-5"><h2 class="font-bold text-lg mb-3">📸 Previous Prescription Photos</h2><div class="grid sm:grid-cols-2 gap-4">';for(const x of rcd.prescriptions||[])h+=`<div class="border rounded-2xl p-3"><b>${esc(x.doctorName)}</b><div class="text-xs text-slate-500">${esc(x.date)}${x.note?' · '+esc(x.note):''}</div><img class="mt-2 rounded-xl w-full max-h-[500px] object-contain bg-slate-100" src="${x.photoData}" alt="Prescription"></div>`;h+=`</div></section><p class="text-xs text-rose-600 mt-6">Read-only share expires: ${new Date(d.expiresAt).toLocaleString()}</p>`;$('out').innerHTML=h}catch(e){$('out').innerHTML='<div class="p-4 bg-rose-50 text-rose-700 rounded-xl">'+esc(e.message)+'</div>'}}run();</script></body></html>
